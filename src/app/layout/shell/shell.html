<header>
  <mat-toolbar class="barre">
    @if (isMobile()) {
      <button mat-icon-button aria-label="Ouvrir le menu" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <a class="marque" routerLink="/">
      <span class="logo" aria-hidden="true"><mat-icon>widgets</mat-icon></span>
      <span class="textes">
        <span class="titre">Catalogue Material</span>
        <span class="sous-titre">Composants Angular Material 22</span>
      </span>
    </a>
    <span class="espace"></span>
    <app-contrast-toggle />
    <app-theme-picker />
  </mat-toolbar>
</header>
<mat-sidenav-container class="conteneur">
  <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()">
    <nav aria-label="Composants">
      <mat-nav-list>
        @for (group of groups; track group.id) {
          <div mat-subheader class="categorie">
            <mat-icon>{{ group.icon }}</mat-icon>
            {{ group.label }}
          </div>
          @for (entry of group.entries; track entry.id) {
            <a
              mat-list-item
              [routerLink]="['/composants', entry.id]"
              routerLinkActive
              #lien="routerLinkActive"
              ariaCurrentWhenActive="page"
              [activated]="lien.isActive"
              (click)="isMobile() && sidenav.close()"
            >
              <mat-icon matListItemIcon>{{ entry.icon }}</mat-icon>
              <span matListItemTitle>{{ entry.label }}</span>
            </a>
          }
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <app-contrast-panel />
    <main #main tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
<app-contrast-overlay />
