@if (inspector.active()) {
  <div class="calque" aria-hidden="true" [style.clip-path]="clipPath()">
    @for (badge of badges(); track badge.item.element) {
      @if (badge.item.status === 'fail') {
        <div
          class="cadre"
          [style.top.px]="badge.top"
          [style.left.px]="badge.left"
          [style.width.px]="badge.width"
          [style.height.px]="badge.height"
        ></div>
      }
      <span
        class="badge"
        [class.echec]="badge.item.status === 'fail'"
        [class.conforme]="badge.item.status === 'pass'"
        [class.inconnu]="badge.item.status === 'unknown'"
        [style.top.px]="badge.top"
        [style.left.px]="badge.left"
        [title]="badge.description"
        >{{ badge.label }}</span
      >
    }
  </div>
}
