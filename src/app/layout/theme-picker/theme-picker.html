<button matButton="tonal" [matMenuTriggerFor]="menu">
  <mat-icon>palette</mat-icon>
  <span class="apercu" [style.background-color]="courant().color"></span>
  <span class="libelle">Thème : {{ courant().label }}</span>
</button>

<mat-menu #menu="matMenu" class="menu-theme">
  <div role="group" aria-labelledby="picker-theme">
    <span class="titre" id="picker-theme">Thème</span>
    @for (groupe of groupes; track groupe.id) {
      <button mat-menu-item [matMenuTriggerFor]="sousMenu">
        <span class="ligne">
          <span>{{ groupe.label }}</span>
          @if (courant().group === groupe.id) {
            <span class="pastille" [style.background-color]="courant().color"></span>
          }
        </span>
      </button>
      <mat-menu #sousMenu="matMenu" class="menu-theme">
        <div role="group" [attr.aria-label]="groupe.label">
          @for (theme of groupe.themes; track theme.id) {
            <button
              mat-menu-item
              role="menuitemradio"
              [attr.aria-checked]="service.theme() === theme.id"
              (click)="service.theme.set(theme.id)"
            >
              <span class="ligne">
                <span class="pastille" [style.background-color]="theme.color"></span>
                <span>{{ theme.shortLabel }}</span>
                @if (service.theme() === theme.id) {
                  <mat-icon class="coche">check</mat-icon>
                }
              </span>
            </button>
          }
        </div>
      </mat-menu>
    }
  </div>
  <mat-divider />
  <div role="group" aria-labelledby="picker-mode">
    <span class="titre" id="picker-mode">Mode</span>
    @for (scheme of schemes; track scheme.id) {
      <button
        mat-menu-item
        role="menuitemradio"
        [attr.aria-checked]="service.scheme() === scheme.id"
        (click)="service.scheme.set(scheme.id)"
      >
        <span class="ligne">
          <mat-icon>{{ scheme.icon }}</mat-icon>
          <span>{{ scheme.label }}</span>
          @if (service.scheme() === scheme.id) {
            <mat-icon class="coche">check</mat-icon>
          }
        </span>
      </button>
    }
  </div>
  <mat-divider />
  <div role="group" aria-labelledby="picker-densite">
    <span class="titre" id="picker-densite">Densité</span>
    @for (density of densities; track density) {
      <button
        mat-menu-item
        role="menuitemradio"
        [attr.aria-checked]="service.density() === density"
        (click)="service.density.set(density)"
      >
        <span class="ligne">
          <span>{{ density === 0 ? '0 (par défaut)' : -density }}</span>
          @if (service.density() === density) {
            <mat-icon class="coche">check</mat-icon>
          }
        </span>
      </button>
    }
  </div>
</mat-menu>
